[project]
name = "clauseguard"
version = "0.1.0"
description = "AI-assisted first-pass compliance/risk analysis for German contracts. Not legal advice."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.12",
    "redis>=5.2",
    "celery>=5.4",
    "python-multipart>=0.0.17",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "rank-bm25>=0.2.2",
    "reportlab>=4.2",
    "anthropic>=0.40",
    "structlog>=24.4",
    "tenacity>=9.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
training = [
    "torch>=2.5",
    "transformers>=4.46",
    "peft>=0.13",
    "datasets>=3.1",
    "accelerate>=1.1",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = [
    "integration: requires real Postgres/Qdrant/Redis (docker compose), not mocked",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
ignore_missing_imports = true
disallow_untyped_defs = false
