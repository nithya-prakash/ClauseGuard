services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clauseguard
      POSTGRES_PASSWORD: clauseguard
      POSTGRES_DB: clauseguard
    ports:
      - "5436:5432"
    volumes:
      - clauseguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauseguard -d clauseguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6339:6333"
      - "6340:6334"
    volumes:
      - clauseguard_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-clauseguard-dev}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - clauseguard_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://clauseguard:clauseguard@postgres:5432/clauseguard
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8004:8000"
    volumes:
      # Embedding/classification/reranking models are downloaded from
      # Hugging Face on first use (see clauseguard_build_conventions memory)
      # - without this, EVERY container recreation re-downloads ~1GB+ of
      # models from scratch. Named volume, not a bind mount (VirtioFS
      # bind-mount deadlocks are a known issue on this host).
      - clauseguard_hf_cache:/root/.cache/huggingface
      # Milestone 16 Phase 15 finding: backend and worker are separate
      # containers with separate filesystems. Without this shared volume,
      # a file the backend saves to its own local /srv/backend/uploads is
      # invisible to the worker container, so every async analysis job
      # failed with a "could not parse the uploaded file" error - a real
      # bug found by actually running the async path against the live
      # worker container, not by reasoning about it in the abstract.
      - clauseguard_uploads:/srv/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=INFO"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://clauseguard:clauseguard@postgres:5432/clauseguard
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - clauseguard_hf_cache:/root/.cache/huggingface
      - clauseguard_uploads:/srv/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Overrides the shared image's HTTP healthcheck (baked in for the
      # backend/uvicorn process) - the worker runs Celery, not a web server,
      # so nothing listens on port 8000 here and that check could never
      # pass. Found and fixed in Milestone 12 while verifying the stack.
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # Baked into the browser bundle at build time (see Dockerfile) -
        # must be the HOST-mapped backend port, not the in-Docker hostname,
        # because the browser runs on the developer's machine.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8004
    ports:
      - "3005:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clauseguard_neo4j:
  clauseguard_pgdata:
  clauseguard_qdrant:
  clauseguard_hf_cache:
  clauseguard_uploads:
